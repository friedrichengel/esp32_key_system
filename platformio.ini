; PlatformIO-Konfiguration – esp32_key_system
; Board: Espressif ESP32-S31-Function-CoreBoard-1 (ESP32-S31, 16 MB Flash, 16 MB PSRAM)
;
; ACHTUNG: Das offizielle Plattformpaket "espressif32" kennt den ESP32-S31 noch nicht
; (https://github.com/platformio/platform-espressif32/issues/1777). Bis dahin wird der
; Fork-Branch mit S31-Board-Manifest verwendet. Alternativ baut das Projekt direkt mit
; ESP-IDF >= 6.1:  idf.py set-target esp32s31 && idf.py build flash monitor
;
; Projektlayout ist ESP-IDF-Standard (main/), deshalb src_dir = main.

[platformio]
default_envs = coreboard1
src_dir = main

[env:coreboard1]
platform = https://github.com/naelolaiz/platform-espressif32.git#esp32s31-support
board = esp32-s31-function-coreboard-1
framework = espidf

board_build.partitions = partitions.csv

monitor_speed = 115200
monitor_filters = esp32_exception_decoder, direct
upload_speed = 460800

; sdkconfig.defaults wird von PlatformIO automatisch berücksichtigt.
build_flags =
  -DPROJECT_NAME=\"esp32_key_system\"

; Post-Build: firmware.bin mit Secure-Padding erzeugen und per espsecure (RSA-3072)
; signieren. Schlüssel: OTA_SIGNING_KEY (Env) oder keys/ota_signing_key.pem.
extra_scripts =
  pre:tools/pio_pre_build.py
  post:tools/sign_firmware.py
